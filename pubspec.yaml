name: writer_plus
description: "A sleek, distraction-free markdown and rich text editor designed for fast note-taking, writing, and local document management."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  flutter_quill: ^11.6.0
  intl: ^0.20.2
  markdown: ^7.3.1
  file_picker: ^13.1.0
  markdown_quill: ^4.3.0
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.1
  receive_sharing_intent: ^1.9.0
  shared_preferences: ^2.5.5

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/writer_plus_app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  remove_alpha_ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/writer_plus_app_logo.png"
  web:
    generate: true
    image_path: "assets/writer_plus_app_logo.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/writer_plus_app_logo.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/writer_plus_app_logo.png"

flutter:
  uses-material-design: true


  assets:
    - assets/

